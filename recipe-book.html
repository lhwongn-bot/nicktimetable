<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食譜簿">
<meta name="theme-color" content="#1a1a1a">
<title>食譜簿</title>
<!--
  個人食譜簿：用 Safari 打開（檔案 App 預覽可能冇 JavaScript）。
  內建 100 款「示範小菜」。問 AI 用你 Safari 登入緊嘅 Gemini；無 API Key。
-->
<style>
:root {
  --bg:#f7f7f5; --surface:#fff; --text:#1a1a1a; --muted:#6b6b6b;
  --border:#e5e5e2; --accent:#1a1a1a; --danger:#b33a3a; --radius:12px; --tap:44px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px); --safe-right:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;min-height:100%;
  padding-top:var(--safe-top);padding-left:var(--safe-left);padding-right:var(--safe-right);
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit}
button{
  cursor:pointer;border:none;background:none;-webkit-appearance:none;appearance:none;
  touch-action:manipulation;
}
img{max-width:100%;display:block}

#bootBanner{
  position:sticky;top:0;z-index:1000;background:#fff3cd;color:#664d03;
  border-bottom:1px solid #ffecb5;padding:12px 16px;font-size:.9rem;line-height:1.45;
}
#bootBanner.error{background:#f8d7da;color:#842029;border-color:#f5c2c7}
#bootBanner.ok{display:none!important}

.header{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--border);padding:12px 16px;
  padding-top:max(12px,var(--safe-top));
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.header h1{font-size:1.25rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.header-actions{display:flex;gap:8px;flex-shrink:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);min-width:var(--tap);padding:0 14px;border-radius:10px;
  font-size:.9375rem;font-weight:500;gap:6px;touch-action:manipulation;
}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-text{color:var(--muted);padding:0 8px}

.search-wrap{position:relative}
.search-wrap input{
  width:100%;min-height:var(--tap);padding:10px 40px 10px 14px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:1rem;
}
.search-clear{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:var(--tap);height:var(--tap);display:none;align-items:center;justify-content:center;
  color:var(--muted);font-size:1.25rem;
}
.search-wrap.has-value .search-clear{display:flex}

.cat-bar{
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin-top:12px;padding-bottom:2px;scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none}
.cat-chip{
  flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:.875rem;font-weight:500;white-space:nowrap;touch-action:manipulation;
}
.cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.main{padding:16px;padding-bottom:calc(130px + var(--safe-bottom));max-width:640px;margin:0 auto}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.count-bar{font-size:.8125rem;color:var(--muted);margin-bottom:12px}
.recipe-list{display:flex;flex-direction:column;gap:12px}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;text-align:left;width:100%;display:flex;gap:12px;align-items:flex-start;
  touch-action:manipulation;
}
.card-thumb-placeholder{
  width:72px;height:72px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:.75rem;font-weight:600;text-align:center;padding:4px;line-height:1.2;
}
.card-body{flex:1;min-width:0}
.card-cat{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.card-title{font-size:1.0625rem;font-weight:600;margin-bottom:6px}
.card-meta{font-size:.8125rem;color:var(--muted);margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:999px;font-size:.75rem;color:var(--muted)}

/* Hidden overlays MUST not eat taps */
.sheet,.overlay,.lightbox,.confirm-box,.menu-panel{
  display:none!important;pointer-events:none!important;visibility:hidden;
}
.sheet.open{
  display:flex!important;pointer-events:auto!important;visibility:visible;
}
.overlay.open,.lightbox.open,.confirm-box.open,.menu-panel.open{
  display:block!important;pointer-events:auto!important;visibility:visible;
}
.lightbox.open{display:flex!important}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35)}
.sheet{
  position:fixed;left:0;right:0;top:0;bottom:0;width:100%;
  height:100%;height:100dvh;max-height:100svh;z-index:60;background:var(--surface);
  flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  padding-left:var(--safe-left);padding-right:var(--safe-right);max-width:640px;margin:0 auto;
}
.sheet-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.sheet-header h2{font-size:1.0625rem;font-weight:600;flex:1;text-align:center}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.sheet-footer{
  display:flex;gap:10px;padding:12px 16px;padding-bottom:max(12px,var(--safe-bottom));
  border-top:1px solid var(--border);flex-shrink:0;
}
.sheet-footer .btn{flex:1}

.field{margin-bottom:16px}
.field label{display:block;font-size:.8125rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.field .hint{font-size:.75rem;color:var(--muted);margin-top:6px}
.field input,.field textarea{
  width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);font-size:1rem;min-height:var(--tap);
}
.field textarea{min-height:120px;resize:vertical;line-height:1.55}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.detail-title{font-size:1.375rem;font-weight:700;margin-bottom:10px}
.detail-section{margin-top:20px}
.detail-section h3{font-size:.8125rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.detail-section pre{
  white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:.9875rem;
  line-height:1.65;background:var(--bg);border-radius:10px;padding:14px;border:1px solid var(--border);
}
.detail-photos{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0 4px}
.detail-photos img,.detail-photos .ph-fallback{
  width:160px;height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--border);flex-shrink:0
}
.detail-photos .ph-fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;padding:8px;text-align:center}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--bg)}
.photo-item img{width:100%;height:100%;object-fit:cover}
.photo-remove{
  position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;
}
.photo-add{
  aspect-ratio:1;border-radius:10px;border:1px dashed var(--border);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:.75rem;min-height:var(--tap)
}
.photo-add span{font-size:1.5rem;line-height:1}

.lightbox{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);
  align-items:center;justify-content:center;padding:16px;
  padding-top:calc(16px + var(--safe-top));padding-bottom:calc(16px + var(--safe-bottom));
}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lightbox-close{position:absolute;top:calc(8px + var(--safe-top));right:max(8px,var(--safe-right));width:var(--tap);height:var(--tap);color:#fff;font-size:1.5rem}

.menu-panel{
  position:fixed;top:calc(var(--safe-top) + 56px);right:max(12px,var(--safe-right));
  z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:220px;overflow:hidden;
}
.menu-panel button{
  display:block;width:100%;text-align:left;padding:14px 16px;min-height:var(--tap);
  font-size:.9375rem;border-bottom:1px solid var(--border);touch-action:manipulation;
}
.menu-panel button:last-child{border-bottom:none}

.fab-stack{
  position:fixed;right:max(16px,var(--safe-right));bottom:calc(20px + var(--safe-bottom));
  z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
}
.fab-stack.is-hidden{display:none!important;pointer-events:none!important}
.fab-ai{
  min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;background:var(--surface);
  color:var(--text);font-weight:600;font-size:.875rem;border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,.12);touch-action:manipulation;
}
.fab-add{
  width:56px;height:56px;min-width:56px;min-height:56px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:1.75rem;line-height:1;
  box-shadow:0 4px 16px rgba(0,0,0,.22);touch-action:manipulation;
}

.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:#fff;padding:12px 20px;border-radius:999px;font-size:.875rem;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.confirm-box{
  position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:70;
  background:var(--surface);border-radius:var(--radius);padding:24px 20px;max-width:360px;margin:0 auto;
  box-shadow:0 12px 40px rgba(0,0,0,.2);
}
.confirm-box p{margin-bottom:16px;font-size:1rem;text-align:center}
.confirm-actions{display:flex;flex-direction:column;gap:10px}
.confirm-actions.row{flex-direction:row}
.confirm-actions .btn{width:100%}

.ai-hint{font-size:.8125rem;color:var(--muted);line-height:1.55;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.ai-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ai-actions .btn{width:100%}
.ai-context-label{font-size:.8125rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.hidden-file{display:none!important}
</style>
</head>
<body>
<div id="bootBanner">載入中…若一直停喺呢度：請用 Safari 打開此檔（分享 → 用 Safari 開啟）。檔案 App 預覽可能冇 JavaScript。</div>
<noscript>
  <div id="bootBanner" class="error" style="display:block">此頁需要 JavaScript。請用 Safari 打開此 HTML 檔（唔好淨係用檔案 App 預覽）。</div>
</noscript>

<header class="header">
  <div class="header-row">
    <h1>食譜簿</h1>
    <div class="header-actions">
      <button type="button" class="btn btn-ghost" id="btnMenu" onclick="RecipeBook&&RecipeBook.menu(event)" aria-label="更多選項">⋯</button>
      <button type="button" class="btn btn-primary" id="btnAdd" onclick="RecipeBook&&RecipeBook.add(event)" aria-label="新增食譜">＋ 新增</button>
    </div>
  </div>
  <div class="search-wrap" id="searchWrap">
    <input type="search" id="searchInput" placeholder="搜尋名稱、材料、標籤、分類…" enterkeyhint="search" autocomplete="off">
    <button type="button" class="search-clear" id="searchClear" aria-label="清除">×</button>
  </div>
  <div class="cat-bar" id="catBar" aria-label="分類篩選"></div>
</header>

<div class="menu-panel" id="menuPanel">
  <button type="button" id="btnExport">匯出 JSON</button>
  <button type="button" id="btnImport">匯入 JSON</button>
  <button type="button" id="btnLoadSeed">載入 100 款示範小菜</button>
</div>
<input type="file" class="hidden-file" id="importFile" accept="application/json,.json">
<input type="file" class="hidden-file" id="photoFile" accept="image/*" multiple>

<main class="main">
  <div class="count-bar" id="countBar"></div>
  <div class="recipe-list" id="recipeList"></div>
  <div class="empty" id="emptyState" style="display:none"></div>
</main>

<div class="fab-stack" id="fabStack">
  <button type="button" class="fab-ai" id="btnAi" onclick="RecipeBook&&RecipeBook.askAi(event)">問 AI</button>
  <button type="button" class="fab-add" id="btnFabAdd" onclick="RecipeBook&&RecipeBook.add(event)" aria-label="新增">＋</button>
</div>

<div class="sheet" id="detailSheet" role="dialog" aria-modal="true">
  <div class="sheet-header">
    <button type="button" class="btn btn-text" id="btnDetailClose">返回</button>
    <h2>食譜詳情</h2>
    <button type="button" class="btn btn-text" id="btnDetailEdit">編輯</button>
  </div>
  <div class="sheet-body" id="detailBody"></div>
  <div class="sheet-footer">
    <button type="button" class="btn btn-ghost" id="btnDetailAskAi">問 AI</button>
    <button type="button" class="btn btn-danger" id="btnDetailDelete">刪除</button>
  </div>
</div>

<div class="sheet" id="formSheet" role="dialog" aria-modal="true">
  <div class="sheet-header">
    <button type="button" class="btn btn-text" id="btnFormCancel" onclick="RecipeBook&&RecipeBook.closeForm(event)">取消</button>
    <h2 id="formTitle">新增食譜</h2>
    <button type="button" class="btn btn-text" id="btnFormSave" style="font-weight:600;color:var(--accent)" onclick="RecipeBook&&RecipeBook.saveForm(event)">儲存</button>
  </div>
  <div class="sheet-body">
    <form id="recipeForm" autocomplete="off">
      <input type="hidden" id="fId">
      <div class="field"><label for="fTitle">名稱 *</label><input type="text" id="fTitle" required placeholder="例如：番茄炒蛋" maxlength="120"></div>
      <div class="field">
        <label>相片（最多 3 張）</label>
        <div class="photo-grid" id="photoEditor"></div>
        <p class="hint">可從相簿揀圖或拍照；儲存前會壓縮。列表示範圖用色塊，詳情頁先載入網絡圖。</p>
      </div>
      <div class="field">
        <label for="fCategory">分類</label>
        <input type="text" id="fCategory" list="categoryList" placeholder="例如：家常菜、示範小菜" maxlength="40" autocomplete="off">
        <datalist id="categoryList"></datalist>
      </div>
      <div class="field"><label for="fTags">標籤</label><input type="text" id="fTags" placeholder="用逗號分隔" maxlength="200"></div>
      <div class="field-row">
        <div class="field"><label for="fCookTime">烹調時間</label><input type="text" id="fCookTime" placeholder="30 分鐘" maxlength="40"></div>
        <div class="field"><label for="fServings">份量</label><input type="text" id="fServings" placeholder="2–3 人" maxlength="40"></div>
      </div>
      <div class="field"><label for="fIngredients">材料</label><textarea id="fIngredients"></textarea></div>
      <div class="field"><label for="fSteps">步驟</label><textarea id="fSteps"></textarea></div>
      <div class="field"><label for="fNotes">備註</label><textarea id="fNotes" style="min-height:80px"></textarea></div>
    </form>
  </div>
  <div class="sheet-footer">
    <button type="button" class="btn btn-ghost" id="btnFormCancelFooter" onclick="RecipeBook&&RecipeBook.closeForm(event)">取消</button>
    <button type="button" class="btn btn-primary" id="btnFormSaveFooter" onclick="RecipeBook&&RecipeBook.saveForm(event)">儲存</button>
  </div>
</div>

<div class="sheet" id="aiSheet" role="dialog" aria-modal="true">
  <div class="sheet-header">
    <button type="button" class="btn btn-text" id="btnAiClose">關閉</button>
    <h2>問 AI</h2>
    <span style="width:44px"></span>
  </div>
  <div class="sheet-body">
    <p class="ai-hint">會用 Safari 而家登入緊嘅 Google 帳戶（即你自己嘅 Gemini）。無 API Key；「去我嘅 Gemini」會先複製問題再打開。</p>
    <div class="ai-context-label" id="aiContextLabel">你嘅問題</div>
    <div class="field"><textarea id="aiQuestion" rows="10" style="min-height:180px" placeholder="輸入煮食問題…"></textarea></div>
    <div class="ai-actions">
      <button type="button" class="btn btn-primary" id="btnAiGemini">去我嘅 Gemini</button>
      <button type="button" class="btn btn-ghost" id="btnAiGoogleMode">Google AI 模式直接問</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="關閉">×</button>
  <img id="lightboxImg" alt="">
</div>

<div class="overlay" id="confirmOverlay"></div>
<div class="confirm-box" id="confirmBox">
  <p id="confirmMsg">確定？</p>
  <div class="confirm-actions" id="confirmActions"></div>
</div>
<div class="toast" id="toast"></div>

<script>

(function () {
  'use strict';

  var STORAGE_KEY = 'recipe-book-v1';
  var SEED_FLAG = 'recipe-book-autoseed-v1';
  var SAMPLE_CAT = '示範小菜';
  var MAX_PHOTOS = 3;
  var MAX_EDGE = 1200;
  var JPEG_QUALITY = 0.7;
  var GEMINI_WEB = 'https://gemini.google.com/app';

pg/960px-thumbnail.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-026","title":"蒜蓉蒸蝦","tags":"蒸菜, 海鮮","cookTime":"15 分鐘","servings":"2–3 人","ingredients":"大蝦 8–10 隻\n蒜蓉、粉絲（可選）、生抽、油、辣椒 適量","steps":"1. 蝦開背去腸；粉絲浸軟墊底（如用）。\n2. 鋪蒜蓉，大火蒸 5–7 分鐘。\n3. 淋生抽同熱油。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Salted_fish.jpg/960px-Salted_fish.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-027","title":"豉汁蒸魚腩","tags":"蒸菜, 海鮮","cookTime":"18 分鐘","servings":"2–3 人","ingredients":"魚腩 300 克\n豆豉、蒜蓉、椒絲、生抽、糖、生粉 適量","steps":"1. 魚腩抹乾加醃料撈勻。\n2. 大火蒸 8–10 分鐘。\n3. 灑蔥同熱油。","notes":"示範食譜（家庭小菜）","photos":["https://upload.wikimedia.org/wikipedia/commons/f/fd/Steamed_salted_fish_diced_chicken_rice_01.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-028","title":"瑤柱蒸水蛋","tags":"蒸菜, 雞蛋","cookTime":"20 分鐘","servings":"2–3 人","ingredients":"雞蛋 3 隻\n瑤柱 3–4 粒（浸軟撕絲）\n溫水、鹽、生抽、油 適量","steps":"1. 瑤柱浸軟留水；蛋液加瑤柱水同溫水。\n2. 過篩加瑤柱絲，蒸 12 分鐘。\n3. 淋生抽熱油。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Portuguese_egg_tart.jpg/960px-Portuguese_egg_tart.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-029","title":"芥菜咸蛋湯","tags":"湯水, 家常菜","cookTime":"25 分鐘","servings":"3–4 人","ingredients":"芥菜 1 棵\n咸蛋 1–2 隻\n瘦肉片或肉丸 適量\n薑片、鹽 適量","steps":"1. 水滾放下薑同咸蛋黃，蛋白可後下。\n2. 下芥菜同肉煮熟。\n3. 調味即可。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Congee.jpg/960px-Congee.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-030","title":"番茄蛋花湯","tags":"湯水, 快煮","cookTime":"15 分鐘","servings":"2–3 人","ingredients":"番茄 2 個\n雞蛋 2 隻\n蔥花、鹽、糖、胡椒 適量","steps":"1. 番茄切塊炒出汁，加水煮滾。\n2. 調味後倒入蛋液成蛋花。\n3. 灑蔥花胡椒。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Corn_soup.jpg/960px-Corn_soup.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-031","title":"玉米蛋花湯","tags":"湯水, 快煮","cookTime":"15 分鐘","servings":"2–3 人","ingredients":"甜玉米粒 1 杯\n雞蛋 2 隻\n水澱粉、鹽、糖、胡椒、葱 適量","steps":"1. 水滾下玉米煮軟。\n2. 調味勾薄芡，倒蛋液。\n3. 灑葱同胡椒。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Egg_drop_soup.jpg/960px-Egg_drop_soup.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-032","title":"冬瓜排骨湯","tags":"湯水, 豬肉","cookTime":"60 分鐘","servings":"4 人","ingredients":"冬瓜 1 件\n排骨 300 克\n薑片、蜜棗或目光 適量\n鹽 適量","steps":"1. 排骨飛水。\n2. 加水同薑蜜棗滾起轉中小火煲 40 分鐘。\n3. 下冬瓜再煲 20 分鐘，調味。","notes":"示範食譜（家庭小菜）","photos":["https://upload.wikimedia.org/wikipedia/commons/7/7f/Winter_melon_soup.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-033","title":"菜干豬肺湯","tags":"湯水, 老火湯","cookTime":"90 分鐘","servings":"4 人","ingredients":"菜干 50 克\n豬肺 半個、豬腱 適量\n薑、南北杏 適量","steps":"1. 菜干浸洗；豬肺洗擦飛水。\n2. 材料落煲加水大火滾後轉小火 1.5 小時。\n3. 下鹽調味。","notes":"示範食譜（家庭小菜）","photos":["https://upload.wikimedia.org/wikipedia/commons/f/f2/Pumpkin_soup.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-034","title":"西洋菜豬骨湯","tags":"湯水, 老火湯","cookTime":"90 分鐘","servings":"4 人","ingredients":"西洋菜 1 斤\n豬骨 400 克\n蜜棗、薑、腰果（可選）適量","steps":"1. 豬骨飛水；西洋菜洗净。\n2. 先煲骨 1 小時，再下菜煲 20–30 分鐘。\n3. 調味。","notes":"示範食譜（家庭小菜）","photos":["https://upload.wikimedia.org/wikipedia/commons/5/54/Tomato_and_potato_soup_HK.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-035","title":"節瓜蝦米粉絲湯","tags":"湯水, 快煮","cookTime":"25 分鐘","servings":"3 人","ingredients":"節瓜 1 個\n蝦米、粉絲、瘦肉片 適量\n薑絲、鹽 適量","steps":"1. 蝦米浸軟；節瓜去皮切件；粉絲浸軟。\n2. 爆香蝦米薑，加水下節瓜煮軟。\n3. 下肉片粉絲煮熟調味。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Stir_Fried_Beef_%40_Congee_Time_%285611725153%29.jpg/960px-Stir_Fried_Beef_%40_Congee_Time_%285611725153%29.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-036","title":"酸辣湯","tags":"湯水, 家常菜","cookTime":"25 分鐘","servings":"3–4 人","ingredients":"豆腐、木耳、筍絲、肉絲、蛋 適量\n醋、胡椒、生抽、生粉、芝麻油 適量","steps":"1. 高湯或清水煮滾，下絲類材料。\n2. 調味勾芡，倒蛋花。\n3. 最後加醋胡椒麻油。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Congee.jpg/960px-Congee.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-037","title":"皮蛋瘦肉粥","tags":"粥, 家常菜","cookTime":"50 分鐘","servings":"3–4 人","ingredients":"米 1 杯\n皮蛋 2 隻、瘦肉 150 克\n薑絲、葱、鹽、油 適量","steps":"1. 米淘洗加少許油鹽搓匀，加水大火煮滾轉小火。\n2. 粥成下薑絲、皮蛋同肉片。\n3. 煮熟調味灑葱。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Congee.jpg/960px-Congee.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-038","title":"魚片粥","tags":"粥, 海鮮","cookTime":"40 分鐘","servings":"3 人","ingredients":"米 1 杯\n新鮮魚片 200 克\n薑絲、油條、葱、胡椒 適量","steps":"1. 煲白粥至稠。\n2. 魚片略醃，粥滾時下魚片燙熟。\n3. 調味加薑葱胡椒，可配油條。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Congee.jpg/960px-Congee.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-039","title":"艇仔粥","tags":"粥, 家常菜","cookTime":"45 分鐘","servings":"3–4 人","ingredients":"白粥 適量\n魷魚、蝦、炸花生、油條、瘦肉、泽鱼 適量\n薑葱、炸蔥 適量","steps":"1. 配料切好；魷魚蝦略焯。\n2. 熱粥分碗，鋪上配料。\n3. 灑薑葱炸花生。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Congee.jpg/960px-Congee.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-040","title":"揚州炒飯","tags":"飯, 家常菜","cookTime":"20 分鐘","servings":"2–3 人","ingredients":"隔夜白飯 2 碗\n雞蛋 2 隻、蝦仁、叉燒丁、青豆 適量\n蔥花、鹽、油 適量","steps":"1. 炒蛋盛起。\n2. 炒香蝦仁叉燒，下飯炒散。\n3. 加蛋青豆鹽炒匀灑蔥。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Egg_fried_rice.jpg/960px-Egg_fried_rice.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-041","title":"蛋炒飯","tags":"飯, 快煮","cookTime":"15 分鐘","servings":"1–2 人","ingredients":"隔夜飯 1–2 碗\n雞蛋 2 隻、葱、鹽、油 適量","steps":"1. 炒散雞蛋。\n2. 下飯壓散炒香。\n3. 加葱同鹽炒匀。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Egg_fried_rice.jpg/960px-Egg_fried_rice.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-042","title":"豉油皇炒麵","tags":"粉麵, 家常菜","cookTime":"20 分鐘","servings":"2 人","ingredients":"蛋麵 2 個\n芽菜、葱、豆芽 適量\n生抽、老抽、糖、油 適量","steps":"1. 麵煮至八成熟瀝乾。\n2. 熱鑊下油將麵煎香。\n3. 加醬料同芽菜葱快炒。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Beef_chow_fun.jpg/960px-Beef_chow_fun.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-043","title":"乾炒牛河","tags":"粉麵, 牛肉","cookTime":"25 分鐘","servings":"2 人","ingredients":"鮮河粉 400 克\n牛肉片 150 克、芽菜、葱 適量\n生抽、老抽、糖、油 適量","steps":"1. 牛肉醃味。\n2. 大火炒牛肉盛起；河粉加醬炒散。\n3. 加芽菜葱同牛肉回鍋快炒。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Beef_chow_fun.jpg/960px-Beef_chow_fun.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-044","title":"星洲炒米","tags":"粉麵, 家常菜","cookTime":"25 分鐘","servings":"2–3 人","ingredients":"米粉 200 克\n蝦仁、叉燒、蛋絲、辣椒 適量\n咖喱粉、生抽、魚露、油 適量","steps":"1. 米粉浸軟瀝乾。\n2. 炒香配料，下粉同咖喱醬料。\n3. 大火炒匀。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Singapore_noodles.jpg/960px-Singapore_noodles.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-045","title":"豉油雞翼飯","tags":"飯, 雞","cookTime":"35 分鐘","servings":"2–3 人","ingredients":"雞翼 8 隻\n薑葱、生抽、老抽、糖、酒、麻油 適量\n白飯 伴","steps":"1. 雞翼煎至兩面金黃。\n2. 加薑葱同醬料水和煮至熟收汁。\n3. 淋在白飯上。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Kung_Pao_chicken_%28western_version%29_-2.jpg/960px-Kung_Pao_chicken_%28western_version%29_-2.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-046","title":"臘味煲仔飯","tags":"飯, 冬季","cookTime":"40 分鐘","servings":"2 人","ingredients":"米 1.5 杯\n臘腸、臘肉 適量\n薑葱、豉油、油 適量","steps":"1. 米洗淨落煲加水煮至收水。\n2. 鋪臘味轉小火逼飯焦。\n3. 淋豉油同油，灑葱拌匀。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Claypot_rice.jpg/960px-Claypot_rice.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-047","title":"窩蛋牛肉飯","tags":"飯, 牛肉","cookTime":"25 分鐘","servings":"1–2 人","ingredients":"牛肉碎或片 150 克\n雞蛋 1 隻、洋葱 適量\n生抽、蚝油、糖、生粉、白飯 適量","steps":"1. 炒香洋葱同牛肉，加水勾芡。\n2. 倒在白飯上，中间打窝。\n3. 煎太陽蛋放上。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Bitter_melon_beef_2023_08.jpg/960px-Bitter_melon_beef_2023_08.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-048","title":"番茄肉片麵","tags":"粉麵, 家常菜","cookTime":"25 分鐘","servings":"2 人","ingredients":"麵 2 個\n番茄 2 個、肉片 150 克\n葱、生抽、糖、生粉 適量","steps":"1. 炒番茄出汁加水成湯。\n2. 下醃肉片煮熟。\n3. 麵另煲熟撈入湯碗。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Biangbiang_noodles.jpg/960px-Biangbiang_noodles.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-049","title":"榨菜肉絲麵","tags":"粉麵, 快煮","cookTime":"20 分鐘","servings":"1–2 人","ingredients":"麵 1–2 個\n榨菜、肉絲、葱 適量\n生抽、胡椒、麻油 適量","steps":"1. 炒香榨菜肉絲。\n2. 加水煮成清湯。\n3. 下麵或撈麵加浇頭。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Hot_dry_noodles.jpg/960px-Hot_dry_noodles.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-050","title":"雲吞麵","tags":"粉麵, 家常菜","cookTime":"30 分鐘","servings":"2 人","ingredients":"麵 2 個、雲吞 8–12 隻\n菜心、葱、蝦子豉油 適量","steps":"1. 湯水煮滾下雲吞至浮起。\n2. 另烫麵同菜心。\n3. 碗內放葱油豉油，撈麵加湯同雲吞。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Singapore_noodles.jpg/960px-Singapore_noodles.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-051","title":"豉油雞","tags":"雞, 鹵味","cookTime":"50 分鐘","servings":"4 人","ingredients":"光雞 半隻至 1 隻\n薑葱、生抽、老抽、糖、酒、八角 適量","steps":"1. 醬料加水煮成卤汁。\n2. 下雞浸卤至熟，可翻面。\n3. 晾涼斬件淋汁。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Crispy_fried_chicken.jpg/960px-Crispy_fried_chicken.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-052","title":"薑葱炒雞","tags":"雞, 家常菜","cookTime":"25 分鐘","servings":"3 人","ingredients":"雞件 500 克\n薑片、葱段 多量\n酒、生抽、蚝油、糖、生粉 適量","steps":"1. 雞件醃味。\n2. 爆香薑葱下雞炒至變色。\n3. 濺酒加水焖熟收汁。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/General_Tso%27s_chicken.jpg/960px-General_Tso%27s_chicken.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-053","title":"咖喱雞","tags":"雞, 家常菜","cookTime":"40 分鐘","servings":"3–4 人","ingredients":"雞件 500 克\n薯仔、洋葱、咖喱塊或粉 適量\n椰漿（可選）、鹽 適量","steps":"1. 炒香洋葱雞件。\n2. 加咖喱同水（或椰漿）下薯仔。\n3. 焖至軟熟調味。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Hainanese_chicken_rice.jpg/960px-Hainanese_chicken_rice.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-054","title":"檸檬雞","tags":"雞, 家常菜","cookTime":"30 分鐘","servings":"3 人","ingredients":"雞胸或髀肉 400 克\n檸檬汁、糖、生抽、生粉、蛋液 適量","steps":"1. 雞肉拍平醃味，拍粉煎或炸至金黃。\n2. 用檸檬汁糖等同少許水煮成醬。\n3. 淋上或回鍋裹酱。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Chicken_feet.jpg/960px-Chicken_feet.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-055","title":"咕嚕肉","tags":"豬肉, 家常菜","cookTime":"35 分鐘","servings":"3–4 人","ingredients":"豬梅肉 300 克\n青紅椒、菠蘿、洋葱 適量\n茄汁、糖、醋、生粉 適量","steps":"1. 肉切件醃後拍粉炸至脆。\n2. 炒香配菜，下茄汁糖醋煮成酸甜醬。\n3. 回鍋肉快炒裹酱。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Sweet_and_sour_pork.jpg/960px-Sweet_and_sour_pork.jpg"],"createdAt":0,"updatedAt":0,"isSeed":true,"category":"示範小菜"},{"id":"seed-056","title":"糖醋排骨","tags":"豬肉, 家常菜","cookTime":"40 分鐘","servings":"3–4 人","ingredients":"排骨 400 克\n糖、醋、生抽、番茄醬、薑葱 適量","steps":"1. 排骨炸或煎至金黃。\n2. 下醬料同水焖至軟。\n3. 大火收汁至亮澤。","notes":"示範食譜（家庭小菜）","photos":["https://thumb.wikimedia.org/wikipedia/co   var recipes = [];
  var storageOk = true;
  var editingId = null;
  var viewingId = null;
  var searchQuery = '';
  var activeCategory = '';
  var formPhotos = [];
  var confirmResolve = null;
  var tapLock = false;
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }

  function setBoot(msg, kind) {
    var b = $('bootBanner');
    if (!b) return;
    if (kind === 'ok') {
      b.className = 'ok';
      b.setAttribute('hidden', 'hidden');
      b.style.display = 'none';
      return;
    }
    b.removeAttribute('hidden');
    b.style.display = '';
    b.className = kind === 'error' ? 'error' : '';
    b.textContent = msg;
  }

  function showToast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function placeholderColor(title) {
    var h = 0;
    String(title || '').split('').forEach(function (c) { h = (h + c.charCodeAt(0) * 17) % PLACEHOLDER_COLORS.length; });
    return PLACEHOLDER_COLORS[h];
  }

  function recipeCategory(r) {
    return (r && r.category) ? String(r.category).trim() : '';
  }

  function cloneSeed() {
    var now = Date.now();
    return SEED_RECIPES.map(function (r, i) {
      return {
        id: r.id || ('seed-' + (i + 1)),
        title: r.title,
        tags: r.tags || '',
        category: r.category || SAMPLE_CAT,
        cookTime: r.cookTime || '',
        servings: r.servings || '',
        ingredients: r.ingredients || '',
        steps: r.steps || '',
        notes: r.notes || '',
        photos: Array.isArray(r.photos) ? r.photos.slice() : [],
        createdAt: r.createdAt || now,
        updatedAt: now,
        isSeed: true
      };
    });
  }

  function normalizeRecipe(r) {
    if (!r || !r.title) return null;
    if (!r.id) r.id = uid();
    if (!Array.isArray(r.photos)) r.photos = [];
    r.photos = r.photos.slice(0, MAX_PHOTOS);
    if (!r.category) r.category = r.isSeed ? SAMPLE_CAT : '';
    if (!r.createdAt) r.createdAt = Date.now();
    if (!r.updatedAt) r.updatedAt = r.createdAt;
    return r;
  }

  function loadFromStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      var list = Array.isArray(data) ? data : (data.recipes || []);
      if (!Array.isArray(list)) return null;
      return list.map(normalizeRecipe).filter(Boolean);
    } catch (e) {
      storageOk = false;
      return null;
    }
  }

  function saveToStorage() {
    if (!storageOk) return false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
      return true;
    } catch (e) {
      storageOk = false;
      showToast('本機儲存不可用，示範食譜仍可瀏覽');
      return false;
    }
  }

  function setSeedFlag() {
    if (!storageOk) return;
    try { localStorage.setItem(SEED_FLAG, '1'); } catch (e) {}
  }

  function initRecipes() {
    // Always start with seeds in memory so UI is never empty if seed exists
    var seeds = cloneSeed();
    var stored = null;
    try {
      stored = loadFromStorage();
    } catch (e) {
      storageOk = false;
      stored = null;
    }

    if (stored && stored.length > 0) {
      recipes = stored;
      // Ensure seed recipes that were never saved can still be loaded via menu;
      // do not wipe user data.
    } else {
      recipes = seeds;
      if (storageOk) {
        if (saveToStorage()) setSeedFlag();
      } else {
        showToast('本機儲存不可用，示範食譜仍可瀏覽');
      }
    }

    // Absolute fallback
    if (!recipes || recipes.length === 0) {
      recipes = seeds;
    }
  }

  function anyOverlayOpen() {
    try {
      if (document.querySelector('.sheet.open')) return true;
      if ($('menuPanel') && $('menuPanel').classList.contains('open')) return true;
      if ($('lightbox') && $('lightbox').classList.contains('open')) return true;
      if ($('confirmBox') && $('confirmBox').classList.contains('open')) return true;
    } catch (e) {}
    return false;
  }

  function updateFabsVisibility() {
    var stack = $('fabStack');
    if (!stack) return;
    if (anyOverlayOpen()) stack.classList.add('is-hidden');
    else stack.classList.remove('is-hidden');
  }

  function guardTap(fn) {
    return function (e) {
      if (e) {
        try { e.preventDefault(); } catch (err) {}
        try { e.stopPropagation(); } catch (err) {}
      }
      if (tapLock) return;
      tapLock = true;
      setTimeout(function () { tapLock = false; }, 400);
      try { fn(e); } catch (err) {
        setBoot('操作出錯：' + (err && err.message ? err.message : String(err)), 'error');
      }
    };
  }

  function bindTap(el, fn) {
    if (!el) return;
    var handler = guardTap(fn);
    el.addEventListener('click', handler, false);
    el.addEventListener('touchend', handler, { passive: false });
  }

  function parseTags(str) {
    if (!str) return [];
    return String(str).split(/[,，、]/).map(function (t) { return t.trim(); }).filter(Boolean);
  }

  function allCategories() {
    var map = {};
    recipes.forEach(function (r) {
      var c = recipeCategory(r);
      if (c) map[c] = (map[c] || 0) + 1;
    });
    var names = Object.keys(map).sort(function (a, b) {
      if (a === SAMPLE_CAT) return -1;
      if (b === SAMPLE_CAT) return 1;
      return a.localeCompare(b, 'zh-Hant');
    });
    return names.map(function (n) { return { name: n, count: map[n] }; });
  }

  function matchesSearch(r, q) {
    if (!q) return true;
    var hay = [r.title||'', r.ingredients||'', r.tags||'', r.notes||'', r.steps||'', recipeCategory(r)].join(' ').toLowerCase();
    return q.split(/\s+/).filter(Boolean).every(function (t) { return hay.indexOf(t) !== -1; });
  }

  function filtered() {
    var q = searchQuery.trim().toLowerCase();
    var list = recipes.filter(function (r) {
      if (activeCategory && recipeCategory(r) !== activeCategory) return false;
      return matchesSearch(r, q);
    });
    list.sort(function (a, b) {
      return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
    });

  function renderCategoryBar() {
    var bar = $('catBar');

    var cats = allCategories();
    if (activeCategory && !cats.some(function (c) { return c.name === activeCategory; })) activeCategory = '';
    var html = '<button type="button" class="cat-chip' + (!activeCategory ? ' active' : '') + '" data-cat="">全部</button>';

      html += '<button type="button" class="cat-chip' + (on ? ' active' : '') + '" data-cat="' + escapeHtml(c.name) + '">' +

  function renderList() {
    renderCategoryBar();
    var list = filtered();
    var listEl = $('recipeList');
    var empty = $('emptyState');
    var countBar = $('countBar');
    if (!listEl) return;

    if (!recipes.length) {

  function saveForm() {

    var now = Date.now();
    var id = $('fId').value;
    var payload = {
      title: title,
      category: $('fCategory').value.trim(),
      tags: $('fTags').value.trim(),
      cookTime: $('fCookTime').value.trim(),
      servings: $('fServings').value.trim(),

      steps: $('fSteps').value,

      photos: formPhotos.slice(0, MAX_PHOTOS),
      updatedAt: now
    };
    if (id) {
      var idx = recipes.findIndex(function (x) { return x.id === id; });
      if (idx !== -1) {
        payload.id = id;
        payload.createdAt = recipes[idx].createdAt || now;
        payload.isSeed = recipes[idx].isSeed;
        recipes[idx] = payload;
      }
    } else {
      payload.id = uid();
      payload.createdAt = now;
      recipes.push(payload);
    }
    saveToStorage();
    closeForm();
    renderList();

  function mergeSeeds() {
    var byId = {}, byTitle = {};
    recipes.forEach(function (r) { byId[r.id] = r; byTitle[r.title] = r; });
    var added = 0, skipped = 0;
    cloneSeed().forEach(function (s) {
      if (byId[s.id] || byTitle[s.title]) { skipped++; return; }
      byId[s.id] = s; added++;
    });
    recipes = Object.keys(byId).map(function (k) { return byId[k]; });
    saveToStorage();
    setSeedFlag();
    renderList();
    showToast('已合併：新增 ' + added + '，略過 ' + skipped);
  }

  function replaceWithSeeds() {
    recipes = cloneSeed();
    saveToStorage();
    setSeedFlag();
    renderList();
    showToast('已取代為 100 款示範小菜');
  }

  function askLoadSeed() {
    closeMenu();
    showConfirm('載入 100 款示範家庭小菜？合併不會刪你現有食譜；取代會清掉目前全部。', [
      { label: '合併加入', value: 'merge', primary: true },
      { label: '取代全部', value: 'replace', danger: true },
      { label: '取消', value: 'cancel' }
    ]).then(function (v) {

      else if (v === 'replace') replaceWithSeeds();
    });

  function approxSizeMB(obj) {
    try { return (JSON.stringify(obj).length * 2) / (1024 * 1024); } catch (e) { return 0; }
  }

  function exportJson() {
    closeMenu();
    var payload = { version: 1, exportedAt: new Date().toISOString(), recipes: recipes };
    var mb = approxSizeMB(payload);
    function writeFile() {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'recipe-book-backup.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast('已匯出 ' + recipes.length + ' 道');
    }
    if (mb > 4) {
      showConfirm('備份約 ' + mb.toFixed(1) + ' MB，繼續？', [
        { label: '取消', value: 'cancel' },
        { label: '繼續匯出', value: 'ok', primary: true }
      ]).then(function (v) { if (v === 'ok') writeFile(); });
    } else writeFile();
  }

  function importJson(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        var incoming = Array.isArray(data) ? data : (data.recipes || []);
        var byId = {};
        recipes.forEach(function (r) { byId[r.id] = r; });
        var added = 0, updated = 0;
        incoming.forEach(function (r) {
          r = normalizeRecipe(r);
          if (!r) return;
          if (byId[r.id]) { byId[r.id] = r; updated++; }
          else { byId[r.id] = r; added++; }
        });
        recipes = Object.keys(byId).map(function (k) { return byId[k]; });
        saveToStorage();
        renderList();
        showToast('匯入完成：新增 ' + added + '，更新 ' + updated);
      } catch (err) { showToast('匯入失敗'); }
    };
    reader.readAsText(file);
  }

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not image')); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('read')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('img')); };
        img.onload = function () {
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, scale = 1;
          if (w > MAX_EDGE || h > MAX_EDGE) scale = MAX_EDGE / Math.max(w, h);
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          try { resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY)); }
          catch (err) { reject(err); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* Ask AI */
  function buildAiPrompt(recipe) {
    if (!recipe) return '你係親切嘅煮食助手，請用繁體中文（香港用字）簡短實用噉答。\n\n我想問：';
    var parts = ['你係親切嘅煮食助手，請用繁體中文（香港用字）簡短實用噉答。', '', '【食譜】' + (recipe.title || '')];
    if (recipeCategory(recipe)) parts.push('分類：' + recipeCategory(recipe));
    if (recipe.cookTime) parts.push('烹調時間：' + recipe.cookTime);
    if (recipe.servings) parts.push('份量：' + recipe.servings);
    if (recipe.ingredients && String(recipe.ingredients).trim()) {
      parts.push('', '【材料】', String(recipe.ingredients).trim());
    }
    if (recipe.steps && String(recipe.steps).trim()) {
      var steps = String(recipe.steps).trim();
      if (steps.length > 800) steps = steps.slice(0, 800) + '…';
      parts.push('', '【步驟】', steps);
    }
    if (recipe.notes && String(recipe.notes).trim()) parts.push('', '【備註】' + String(recipe.notes).trim());
    parts.push('', '請根據以上食譜，建議：1）常見替代材料；2）火候／調味小貼士；3）點樣更易煮成功。');
    return parts.join('\n');
  }

  function openAiSheet(fromRecipeId) {
    closeMenu();
    var rid = fromRecipeId || viewingId || null;
    var recipe = rid ? recipes.find(function (x) { return x.id === rid; }) : null;
    $('aiContextLabel').textContent = recipe ? ('關於「' + recipe.title + '」嘅問題（可改）') : '你嘅問題（可改）';

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }
  function fallbackCopy(text) {
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy'));
      } catch (e) { reject(e); }
    });
  }
  function openUrl(url) {
    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { w = null; }
    if (!w) window.location.assign(url);
  }
  function goMyGemini() {
    var q = $('aiQuestion').value.trim();
    if (!q) { showToast('請先輸入問題'); return; }
    copyText(q).then(function () {
      showToast('已複製問題，喺 Gemini 貼上即可');
      setTimeout(function () { openUrl(GEMINI_WEB); }, 350);
    }).catch(function () {
      showToast('未能自動複製，開啟 Gemini 後請手動貼上');
      setTimeout(function () { openUrl(GEMINI_WEB); }, 350);
    });
  }
  function goGoogleAiMode() {
    var q = $('aiQuestion').value.trim();
    if (!q) { showToast('請先輸入問題'); return; }
    var flat = q.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
    openUrl(GOOGLE_AI_MODE + encodeURIComponent(flat));
  }

  /* Public API for onclick backup */
  function add(e) { closeMenu(); openForm(null); }
  function menu(e) { toggleMenu(); }
  function askAi(e) { openAiSheet(null); }

  window.RecipeBook = {
    add: function (e) { guardTap(add)(e); },
    menu: function (e) { guardTap(menu)(e); },
    askAi: function (e) { guardTap(askAi)(e); },
    saveForm: function (e) { guardTap(saveForm)(e); },
    closeForm: function (e) { guardTap(closeForm)(e); }
  };

  function wire() {
    bindTap($('btnAdd'), add);
    bindTap($('btnFabAdd'), add);
    bindTap($('btnMenu'), menu);
    bindTap($('btnAi'), askAi);
    bindTap($('btnExport'), exportJson);
    bindTap($('btnImport'), function () { closeMenu(); $('importFile').click(); });
    bindTap($('btnLoadSeed'), askLoadSeed);

    bindTap($('btnDetailClose'), closeDetail);
    bindTap($('btnDetailEdit'), function () { if (viewingId) openForm(viewingId); });
    bindTap($('btnDetailDelete'), function () { if (viewingId) askDelete(viewingId); });
    bindTap($('btnDetailAskAi'), function () { openAiSheet(viewingId); });

    bindTap($('btnFormCancel'), closeForm);
    bindTap($('btnFormCancelFooter'), closeForm);
    bindTap($('btnFormSave'), saveForm);
    bindTap($('btnFormSaveFooter'), saveForm);

    bindTap($('btnAiClose'), closeAiSheet);
    bindTap($('btnAiGemini'), goMyGemini);
    bindTap($('btnAiGoogleMode'), goGoogleAiMode);
    bindTap($('lightboxClose'), closeLightbox);

    $('recipeForm').addEventListener('submit', function (e) { e.preventDefault(); saveForm(); });

    $('recipeList').addEventListener('click', function (e) {
      var card = e.target.closest('.card');
      if (card) openDetail(card.getAttribute('data-id'));
    });

    $('catBar').addEventListener('click', function (e) {
      var chip = e.target.closest('.cat-chip');
      if (!chip) return;
      activeCategory = chip.getAttribute('data-cat') || '';
      renderList();
    });

    $('detailBody').addEventListener('click', function (e) {
      var img = e.target.closest('.detail-photos img');
      if (img && img.src) openLightbox(img.src);
    });

    $('photoEditor').addEventListener('click', function (e) {
      var rm = e.target.closest('.photo-remove');
      if (rm) {
        formPhotos.splice(parseInt(rm.getAttribute('data-idx'), 10), 1);
        renderPhotoEditor();
        return;
      }
      if (e.target.closest('#btnAddPhoto')) $('photoFile').click();
    });

    $('photoFile').addEventListener('change', function () {
      var files = this.files ? Array.prototype.slice.call(this.files) : [];
      this.value = '';
      var room = MAX_PHOTOS - formPhotos.length;
      if (room <= 0) { showToast('最多 ' + MAX_PHOTOS + ' 張'); return; }
      files = files.slice(0, room);
      if (!files.length) return;
      showToast('壓縮相片中…');
      var chain = Promise.resolve();
      files.forEach(function (file) {
        chain = chain.then(function () {
          return compressImage(file).then(function (dataUrl) {
            if (formPhotos.length < MAX_PHOTOS) formPhotos.push(dataUrl);
          }).catch(function () { showToast('有相片無法加入'); });
        });
      });
      chain.then(function () { renderPhotoEditor(); showToast('已加入相片'); });
    });

    $('importFile').addEventListener('change', function () {
      importJson(this.files && this.files[0]); this.value = '';
    });

    $('confirmActions').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-value]');
      if (!btn || !confirmResolve) return;
      var val = btn.getAttribute('data-value');
      var r = confirmResolve;
      hideConfirm();
      r(val);
    });

    $('confirmOverlay').addEventListener('click', function () {
      if (confirmResolve) { var r = confirmResolve; hideConfirm(); r('cancel'); }
    });

    document.addEventListener('click', function (e) {
      var menu = $('menuPanel');
      if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target.id !== 'btnMenu' && !e.target.closest('#btnMenu')) {
        closeMenu();
      }
    });

    $('lightbox').addEventListener('click', function (e) {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    var searchInput = $('searchInput');
    var searchWrap = $('searchWrap');
    searchInput.addEventListener('input', function () {
      searchQuery = this.value;
      searchWrap.classList.toggle('has-value', !!this.value);
      renderList();
    });
    bindTap($('searchClear'), function () {
      searchInput.value = '';
      searchQuery = '';
      searchWrap.classList.remove('has-value');
      renderList();
    });
  }

  function boot() {
    setBoot('載入中…');
    // 1) seeds in memory + paint immediately
    recipes = cloneSeed();
    renderList();
    updateFabsVisibility();

    // 2) then storage merge without wiping incorrectly
    initRecipes();
    renderList();
    updateFabsVisibility();
    wire();
    setBoot('', 'ok');
    if (!storageOk) showToast('本機儲存不可用，示範食譜仍可瀏覽');
  }

  try {
    boot();
  } catch (err) {
    try {
      // last-ditch: show seeds even if something failed
      recipes = cloneSeed();
      renderList();
      wire();
    } catch (e2) {}
    setBoot('載入失敗：' + (err && err.message ? err.message : String(err)) + '。請用 Safari 打開此檔（分享 → 用 Safari 開啟）。', 'error');
  }
})();

</script>
</body>
</html>
